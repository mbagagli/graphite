[package]
name = "graphite"
version = "0.3.5"
description = "Discover Knowledge with a local-first visual research environment"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "graphite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
agent-cuda = ["llama-cpp-2/cuda"]
agent-metal = ["llama-cpp-2/metal"]
pdf-shadow-pilot = ["tokio/io-util", "tokio/process"]
pdf-search-experiment = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
encoding_rs = "0.8.35"
fastembed = { version = "=5.17.4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
futures-util = "0.3.32"
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq"] }
llama-cpp-2 = "=0.1.154"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "stream"] }
regex = "1.12.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sysinfo = "0.37.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "time"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
usearch = "=2.26.0"
zip = { version = "=9.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies.ort]
version = "=2.0.0-rc.13"
default-features = false
features = ["directml"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies.ort]
version = "=2.0.0-rc.13"
default-features = false
features = ["coreml"]
