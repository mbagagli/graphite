name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  frontend-validation:
    name: Frontend and repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@11.17.0

      - name: Report JavaScript tool versions
        run: |
          node --version
          npm --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check repository hygiene
        run: npm run check:hygiene

      - name: Check public source contents
        run: npm run check:publication && npm run check:privacy

      - name: Check production packaging configuration
        run: npm run package:check

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run check

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Pages and verify screenshot provenance
        run: npm run site:build

  rust-linux-validation:
    name: Rust and native validation (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up pinned npm
        run: npm install --global npm@11.17.0

      - name: Report native tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cmake --version
          clang --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Rust application
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

      - name: Link development-flavor Tauri application without bundling
        run: npm run tauri -- build --debug --no-bundle --ci --config src-tauri/tauri.dev.conf.json -- --locked

  native-compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native validation (Windows x64)
            runner: windows-2025
            linked: true
          - name: Native validation (macOS ARM64)
            runner: macos-15
            linked: true
          - name: Native check only (macOS Intel x64)
            runner: macos-15-intel
            linked: false
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@11.17.0

      - name: Report tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cmake --version
          clang --version

      - name: Resolve libclang from PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Get-Command clang.exe -ErrorAction Stop
          "LIBCLANG_PATH=$($clang.Source | Split-Path)" >> $env:GITHUB_ENV

      - name: Configure the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        if: ${{ !matrix.linked }}
        run: npm run build

      - name: Link development-flavor Tauri application without bundling
        if: matrix.linked
        run: npm run tauri -- build --debug --no-bundle --ci --config src-tauri/tauri.dev.conf.json -- --locked

      - name: Check all Rust targets without linking ONNX Runtime
        if: ${{ !matrix.linked }}
        env:
          ORT_SKIP_DOWNLOAD: "1"
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
