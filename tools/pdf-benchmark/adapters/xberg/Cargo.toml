[package]
name = "graphite-pdf-benchmark-xberg"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[features]
default = ["native"]
native = []
ocr = ["xberg/ocr"]

[dependencies]
graphite-pdf-benchmark-common = { path = "../../common" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
xberg = { version = "=1.0.14", default-features = false, features = ["tokio-runtime", "pdf"] }
